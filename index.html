    <meta name="keywords" content="calculatrice, calculatrice en ligne, javascript, html css, addition, soustraction, multiplication, division">

<body>
    <main class="calculatrice">
        <span class="affichage"></span>
        <div class="bouton">
            <ul>
                <li>7</li>
                <li>8</li>
                <li>9</li>
                <li>+</li>
            </ul>
            <ul>
                <li>4</li>
                <li>5</li>

                <li>-</li>
            </ul>
            <ul>
                <li>1</li>
                <li>2</li>
                <li>3</li>
                <li>*</li>
            </ul>
            <ul>
                <li class="clear">effacer</li>
                <li>0</li>
                <li class="validate">valider</li>
                <li>/</li>
            </ul>
        </div>


    </main>
